name: Publish

on:
  push:
    branches:
      - main
      - v1.X

permissions:
  contents: read

jobs:
  run-publish:
    name: Run publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - name: Check out git repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Before setup-node, so its `cache: pnpm` can resolve the store path.
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check version and publish
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Check if version exists in npm registry
          if npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version &>/dev/null; then
            echo "Version $CURRENT_VERSION already published, skipping"
            exit 0
          fi

          if [[ "$CURRENT_VERSION" =~ (next) ]]; then
            pnpm publish:next
          else
            pnpm publish:latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_PADDLE_JS_WRAPPER }}
