name: Publish

on:
  push:
    branches:
      - main
      - v1.X

permissions:
  contents: read

jobs:
  run-publish:
    name: Run publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - name: Check out git repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: lts/*
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install yarn dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Check version and publish
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Check if version exists in npm registry
          if npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version &>/dev/null; then
            echo "Version $CURRENT_VERSION already published, skipping"
            exit 0
          fi

          if [[ "$CURRENT_VERSION" =~ (next) ]]; then
            yarn publish:next
          else
            yarn publish:latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_PADDLE_JS_WRAPPER }}
